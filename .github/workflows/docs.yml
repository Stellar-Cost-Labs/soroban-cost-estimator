name: Deploy docs

on:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: cargo install mdbook mdbook-mermaid
      - name: Build
        run: cd docs && mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - uses: actions/deploy-pages@v4
